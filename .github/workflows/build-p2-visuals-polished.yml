name: 生成市政论文图表优化终版

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/gen_p2_visuals_polished.py"
      - ".github/scripts/apply_p2_visuals_polished.py"
      - ".github/scripts/qa_p2_visuals_polished.py"
      - ".github/scripts/update_p2_v2_toc.py"
      - ".github/workflows/build-p2-visuals-polished.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖与渲染环境
        run: |
          python -m pip install --upgrade pip
          pip install python-docx lxml pillow matplotlib pdfplumber
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer poppler-utils fonts-noto-cjk fonts-arphic-ukai

      - name: 生成高质量技术图
        run: python .github/scripts/gen_p2_visuals_polished.py

      - name: 仅优化图片与正文表格
        run: python .github/scripts/apply_p2_visuals_polished.py

      - name: 首次渲染
        shell: bash
        run: |
          set -euo pipefail
          DOC="新建文件夹/新建文件夹/装配式施工质量管理问题及优化研究——以市政项目为例/装配式施工质量管理问题及优化研究——以市政项目为例_图表优化终版.docx"
          rm -rf qa_p2_polished
          mkdir -p qa_p2_polished/pass1 qa_p2_polished/final
          libreoffice --headless --convert-to pdf --outdir qa_p2_polished/pass1 "$DOC"

      - name: 校准目录与正文总页数
        shell: bash
        run: |
          set -euo pipefail
          DOC="新建文件夹/新建文件夹/装配式施工质量管理问题及优化研究——以市政项目为例/装配式施工质量管理问题及优化研究——以市政项目为例_图表优化终版.docx"
          PDF="$(find qa_p2_polished/pass1 -maxdepth 1 -name '*.pdf' -print -quit)"
          python .github/scripts/update_p2_v2_toc.py "$DOC" "$PDF"

      - name: 最终渲染与严格校验
        shell: bash
        run: |
          set -euo pipefail
          SRC="新建文件夹/新建文件夹/装配式施工质量管理问题及优化研究——以市政项目为例/装配式施工质量管理问题及优化研究——以市政项目为例_最终优化版.docx"
          DOC="新建文件夹/新建文件夹/装配式施工质量管理问题及优化研究——以市政项目为例/装配式施工质量管理问题及优化研究——以市政项目为例_图表优化终版.docx"
          libreoffice --headless --convert-to pdf --outdir qa_p2_polished/final "$DOC"
          PDF="$(find qa_p2_polished/final -maxdepth 1 -name '*.pdf' -print -quit)"
          python .github/scripts/qa_p2_visuals_polished.py "$SRC" "$DOC" "$PDF"
          TOTAL="$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')"
          pdftoppm -png -r 100 -f 1 -l 9 "$PDF" qa_p2_polished/final/front >/dev/null 2>&1
          START=$(( TOTAL > 4 ? TOTAL-4 : 1 ))
          pdftoppm -png -r 100 -f "$START" -l "$TOTAL" "$PDF" qa_p2_polished/final/tail >/dev/null 2>&1
          # 全部页面低分辨率渲染，确保不存在空白页/对象渲染失败
          pdftoppm -png -r 72 "$PDF" qa_p2_polished/final/all >/dev/null 2>&1

      - name: 提交图表优化终版
        shell: bash
        run: |
          set -euo pipefail
          DOC="新建文件夹/新建文件夹/装配式施工质量管理问题及优化研究——以市政项目为例/装配式施工质量管理问题及优化研究——以市政项目为例_图表优化终版.docx"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DOC"
          if git diff --cached --quiet; then
            echo "图表优化终版无变化"
          else
            git commit -m "优化市政论文全部图片与正文表格"
            git push
          fi

      - name: 上传完整论文与校验材料
        uses: actions/upload-artifact@v4
        with:
          name: 市政装配式论文图表优化终版
          path: |
            新建文件夹/新建文件夹/装配式施工质量管理问题及优化研究——以市政项目为例/装配式施工质量管理问题及优化研究——以市政项目为例_图表优化终版.docx
            qa_p2_polished/final/*.pdf
            qa_p2_polished/final/front-*.png
            qa_p2_polished/final/tail-*.png
