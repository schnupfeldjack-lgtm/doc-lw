name: 检查市政论文表格
on:
  push:
    branches: [main]
    paths: [".github/scripts/dump_p2_tables.py",".github/workflows/dump-p2-tables.yml"]
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install python-docx
      - run: python .github/scripts/dump_p2_tables.py
