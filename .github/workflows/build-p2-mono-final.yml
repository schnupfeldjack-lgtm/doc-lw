name: 生成市政论文黑白图表终版
on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/gen_p2_mono_figs.py"
      - ".github/scripts/apply_p2_mono_tables.py"
      - ".github/scripts/qa_p2_mono.py"
      - ".github/scripts/update_p2_v2_toc.py"
      - ".github/workflows/build-p2-mono-final.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install python-docx lxml pillow matplotlib pdfplumber
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer poppler-utils fonts-noto-cjk fonts-arphic-ukai
      - name: 生成黑白技术图
        run: python .github/scripts/gen_p2_mono_figs.py
      - name: 应用黑白图片和表格
        run: python .github/scripts/apply_p2_mono_tables.py
      - name: 首次渲染
        run: |
          set -euo pipefail
          DOC="新建文件夹/新建文件夹/装配式施工质量管理问题及优化研究——以市政项目为例/装配式施工质量管理问题及优化研究——以市政项目为例_黑白图表终版.docx"
          rm -rf qa_p2_mono && mkdir -p qa_p2_mono/pass1 qa_p2_mono/final
          libreoffice --headless --convert-to pdf --outdir qa_p2_mono/pass1 "$DOC"
      - name: 校准目录与页码
        run: |
          set -euo pipefail
          DOC="新建文件夹/新建文件夹/装配式施工质量管理问题及优化研究——以市政项目为例/装配式施工质量管理问题及优化研究——以市政项目为例_黑白图表终版.docx"
          PDF="$(find qa_p2_mono/pass1 -maxdepth 1 -name '*.pdf' -print -quit)"
          python .github/scripts/update_p2_v2_toc.py "$DOC" "$PDF"
      - name: 最终渲染并严格校验
        run: |
          set -euo pipefail
          DOC="新建文件夹/新建文件夹/装配式施工质量管理问题及优化研究——以市政项目为例/装配式施工质量管理问题及优化研究——以市政项目为例_黑白图表终版.docx"
          libreoffice --headless --convert-to pdf --outdir qa_p2_mono/final "$DOC"
          PDF="$(find qa_p2_mono/final -maxdepth 1 -name '*.pdf' -print -quit)"
          python .github/scripts/qa_p2_mono.py "$DOC" "$PDF"
          TOTAL="$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')"
          pdftoppm -png -r 100 -f 1 -l 9 "$PDF" qa_p2_mono/final/front >/dev/null 2>&1
          START=$(( TOTAL > 5 ? TOTAL-5 : 1 ))
          pdftoppm -png -r 100 -f "$START" -l "$TOTAL" "$PDF" qa_p2_mono/final/tail >/dev/null 2>&1
      - name: 提交终版
        run: |
          set -euo pipefail
          DOC="新建文件夹/新建文件夹/装配式施工质量管理问题及优化研究——以市政项目为例/装配式施工质量管理问题及优化研究——以市政项目为例_黑白图表终版.docx"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DOC"
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -m "修正市政论文黑白图片与表格排版"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: 市政装配式论文黑白图表终版
          path: |
            新建文件夹/新建文件夹/装配式施工质量管理问题及优化研究——以市政项目为例/装配式施工质量管理问题及优化研究——以市政项目为例_黑白图表终版.docx
            qa_p2_mono/final/*.pdf
            qa_p2_mono/final/front-*.png
            qa_p2_mono/final/tail-*.png
