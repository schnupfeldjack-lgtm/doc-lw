name: 修复BIM论文图片

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-bim-images.yml"
      - ".github/scripts/repair_bim_images.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install lxml cairosvg

      - name: 修复论文图片
        run: python .github/scripts/repair_bim_images.py

      - name: 提交修复版
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "新建文件夹/新建文件夹/BIM协同设计对建筑结构设计质量的影响研究——以装配式住宅项目为例/BIM协同设计对建筑结构设计质量的影响研究——以装配式住宅项目为例_图片修复版.docx"
          if git diff --cached --quiet; then
            echo "没有文件变化"
          else
            git commit -m "修复BIM论文正文图片"
            git push
          fi

      - name: 上传修复版
        uses: actions/upload-artifact@v4
        with:
          name: BIM论文图片修复版
          path: "新建文件夹/新建文件夹/BIM协同设计对建筑结构设计质量的影响研究——以装配式住宅项目为例/BIM协同设计对建筑结构设计质量的影响研究——以装配式住宅项目为例_图片修复版.docx"
