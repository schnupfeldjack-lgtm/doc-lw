name: 审核BIM终稿结构
on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/audit_bim_final.py"
      - ".github/workflows/audit-bim-final.yml"
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install python-docx
      - run: python .github/scripts/audit_bim_final.py
